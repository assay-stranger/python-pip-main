# ============================================================================
# COLD-RUN INSTRUMENTATION — NOT THE QUICKSTART.
#
# This workflow sits beside .github/workflows/ferralon-assay.yml, which is the
# README quickstart, unchanged. It replays that quickstart job's runner settings
# and steps verbatim, and wraps them in a network recording taken on the runner
# itself (tcpdump on the runner; no third-party service). It uploads the DNS and
# outbound-connection listing, plus the scan's output directory, as artifacts.
#
# Generated by scripts/coldrun.sh sync. Do not edit by hand: `check` regenerates
# it from the quickstart and fails on any difference.
# ============================================================================
name: "Cold-run instrumentation (network capture)"

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  assay-capture:
    runs-on: ubuntu-latest
    permissions:
      # actions/checkout, and the scan reads the checked-out tree.
      contents: read
      # The pinned-Issue dashboard surface (the `issue` input, on by default).
      issues: write
      # The sticky PR-comment surface (the `pr-comment` input, on by default).
      pull-requests: write
      # The SARIF upload step below (the `code-scanning` input, on by default).
      security-events: write
    steps:
      - name: "[cold-run instrumentation] start DNS and connection recording"
        run: |
          # tcpdump is on the runner image; install it only if a future image drops it.
          # This happens before recording starts, so it is not part of the recorded run.
          command -v tcpdump >/dev/null || sudo apt-get install -y -qq tcpdump
          cap="$RUNNER_TEMP/coldrun-capture"
          mkdir -p "$cap"
          sudo tcpdump -i any -nn -U -w "$cap/all.pcap" >"$cap/tcpdump.log" 2>&1 &
          echo $! > "$cap/tcpdump.pid"
          sleep 3
      - uses: actions/checkout@v4

      - name: Run the Ferralon Assay
        id: assay
        uses: ferralon-ai/ferralon-assay@v0.6
        with:
          mode: baseline
          target: .
          # The scanner carries no advisories of its own: the corpus supplies them,
          # and a scan with none fails. Left on its default ref (main) on purpose —
          # new advisories land there continuously, so pinning this ref would freeze
          # your vulnerability intel. The policy chooses which of its advisories the
          # scan evaluates; the release that carries it is signed by this identity.
          advisory-corpus-repo: ferralon-ai/vulnerability-corpus
          advisory-corpus-policy: full
          corpus-signer-identity: ferralon-intel-publisher@ferralon.iam.gserviceaccount.com
          corpus-signer-issuer: https://accounts.google.com

      # The Action materializes report.sarif.json; the upload to code scanning is this
      # step, so drop it and the `code-scanning` surface produces a file and nothing else.
      - name: Upload the SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: ${{ steps.assay.outputs.sarif-file }}
          category: ferralon-assay
      - name: "[cold-run instrumentation] stop recording and list DNS lookups and connections"
        if: always()
        run: |
          cap="$RUNNER_TEMP/coldrun-capture"
          sudo kill -INT "$(cat "$cap/tcpdump.pid")" || true
          sleep 2
          cat > "$cap/parse_capture.py" <<'PY'
          """Turn `tcpdump -nn` text on stdin into a DNS and outbound-connection listing.

          Usage: parse_capture.py OUTDIR < tcpdump.txt

          Writes OUTDIR/dns-queries.txt, OUTDIR/connections.tsv and OUTDIR/capture-summary.json.
          Reads only text; it contacts nothing and calls no third-party service.
          """
          import json
          import re
          import sys
          from collections import defaultdict

          QUERY = re.compile(r"\b(\d+)[+%\-\*|]*\s+(?:\[[^\]]*\]\s+)?(?:A|AAAA|HTTPS|SVCB|CNAME|TXT|MX|SRV|NS|PTR)\?\s+(\S+?)\.?\s")
          ANSWER = re.compile(r"\b(\d+)\*?\|?-?\s+(?:q:\s+\S+\s+)?\d+/\d+/\d+\s")
          RECORD = re.compile(r"\b(?:A|AAAA)\s+([0-9a-fA-F:.]+)")
          CANON = re.compile(r"\b(?:A|AAAA)\?\s+(\S+?)\.?\s")
          SYN = re.compile(r"IP6?\s+(\S+)\.(\d+)\s+>\s+(\S+)\.(\d+):\s+Flags\s+\[S\]")


          def main(outdir):
              names_by_id = {}
              ip_names = defaultdict(set)
              queries = set()
              conns = {}
              for line in sys.stdin:
                  q = QUERY.search(line)
                  if q:
                      queries.add(q.group(2).lower())
                      names_by_id.setdefault(q.group(1), set()).add(q.group(2).lower())
                  a = ANSWER.search(line)
                  if a:
                      names = set(names_by_id.get(a.group(1), ()))
                      inline = CANON.search(line)
                      if inline:
                          names.add(inline.group(1).lower())
                      for ip in RECORD.findall(line):
                          ip_names[ip].update(names)
                  s = SYN.search(line)
                  if s and not (s.group(3).startswith("127.") or s.group(3) == "::1"):
                      conns[(s.group(3), s.group(4))] = conns.get((s.group(3), s.group(4)), 0) + 1
              with open(outdir + "/dns-queries.txt", "w") as f:
                  f.writelines(n + "\n" for n in sorted(queries))
              with open(outdir + "/connections.tsv", "w") as f:
                  f.write("dst_ip\tdst_port\tsyn_count\tnames\n")
                  for (ip, port), n in sorted(conns.items()):
                      f.write("%s\t%s\t%d\t%s\n" % (ip, port, n, ",".join(sorted(ip_names.get(ip, ())))))
              summary = {
                  "dns_names": len(queries),
                  "outbound_connections": len(conns),
                  "unnamed_connections": sum(1 for (ip, _p) in conns if not ip_names.get(ip)),
              }
              with open(outdir + "/capture-summary.json", "w") as f:
                  json.dump(summary, f, sort_keys=True)
                  f.write("\n")


          if __name__ == "__main__":
              main(sys.argv[1])
          PY
          sudo chown -R "$(id -u):$(id -g)" "$cap"
          tcpdump -nn -r "$cap/all.pcap" > "$cap/tcpdump.txt" 2>/dev/null || true
          python3 -I "$cap/parse_capture.py" "$cap" < "$cap/tcpdump.txt"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f "$GITHUB_STEP_SUMMARY" ]; then
            cp "$GITHUB_STEP_SUMMARY" "$cap/step-summary.md"
          fi
          {
            echo "### Cold-run instrumentation: network listing"
            cat "$cap/capture-summary.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: "[cold-run instrumentation] upload the network listing"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coldrun-network-capture
          path: ${{ runner.temp }}/coldrun-capture/
          if-no-files-found: warn
      - name: "[cold-run instrumentation] upload the scan output directory"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coldrun-assay-out
          path: ${{ steps.assay.outputs.out-dir }}
          if-no-files-found: warn
